[package]
name = "vmdesk-providers"
description = "Inventory providers: static, ssh_config; cloud providers behind features"
version.workspace = true
edition.workspace = true

[features]
default = []
aws       = ["dep:aws-config", "dep:aws-sdk-ec2"]
openstack = ["dep:reqwest"]
gcp       = ["dep:reqwest"]
azure     = ["dep:reqwest"]

[dependencies]
vmdesk-core.workspace = true
async-trait.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
thiserror.workspace = true
tracing.workspace = true
aws-config  = { workspace = true, optional = true }
aws-sdk-ec2 = { workspace = true, optional = true }
reqwest     = { workspace = true, optional = true }

[lints]
workspace = true
